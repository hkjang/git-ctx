apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-ctx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-ctx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-ctx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4747"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: git-ctx
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-ctx
          image: git-ctx:v0.62.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4747
          envFrom:
            - secretRef:
                name: git-ctx-bootstrap
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /var/lib/git-ctx/backups
      volumes:
        - name: tmp
          emptyDir: {}
        - name: backups
          persistentVolumeClaim:
            claimName: git-ctx-backups
