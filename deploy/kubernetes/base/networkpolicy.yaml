apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-ctx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: git-ctx
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4747
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
