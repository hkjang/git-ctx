apiVersion: v1
kind: Secret
metadata:
  name: git-ctx-bootstrap
type: Opaque
stringData:
  GIT_CTX_DB_DSN: "postgres://gitctx:CHANGE_ME@postgres.database.svc:5432/gitctx?sslmode=require"
  GIT_CTX_API_KEY_PEPPER: "CHANGE_TO_AT_LEAST_32_RANDOM_CHARACTERS"
  GIT_CTX_MASTER_KEY: "CHANGE_TO_EXACTLY_32_RANDOM_BYTES"
  GIT_CTX_BOOTSTRAP_ADMIN: "REMOVE_AFTER_KEYCLOAK_CONFIGURATION"
