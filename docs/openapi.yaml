openapi: 3.1.0
info:
  title: git-ctx REST API
  version: 0.19.0
  description: User and administrative API for the Context7-compatible internal repository knowledge platform.
servers:
  - url: https://git-ctx.company.local
security:
  - keycloakBearer: []
paths:
  /api/v1/public/config:
    get:
      {
        summary: Public non-secret UI branding,
        security: [],
        responses: { "200": { description: Branding configuration } },
      }
  /api/v1/public/status:
    get:
      {
        summary: Public non-secret metadata database connectivity and latency,
        security: [],
        responses: { "200": { description: Connected }, "503": { description: Database unavailable } },
      }
  /api/v1/bootstrap/login:
    post:
      {
        summary: Exchange the one-time initial administrator token for a short-lived HttpOnly session,
        security: [],
        responses: { "200": { description: Bootstrap session created }, "401": { description: Invalid or revoked bootstrap token } },
      }
  /api/v1/recovery/login:
    post:
      {
        summary: Consume a server-generated one-time recovery token and create a restricted 30-minute platform administrator session,
        security: [],
        responses: { "200": { description: Recovery session created }, "401": { description: Invalid expired or already consumed token } },
      }
  /api/v1/me:
    get:
      {
        summary: Current user principal and service version,
        responses: { "200": { description: User principal } },
      }
  /api/v1/me/repositories:
    get:
      {
        summary: ACL-filtered source repositories,
        responses: { "200": { description: Repository list } },
      }
  /api/v1/me/api-keys:
    get:
      {
        summary: List personal MCP keys without secrets,
        responses: { "200": { description: Key list } },
      }
    post:
      summary: Create a personal MCP key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKey" }
      responses:
        "201": { description: Key and one-time plaintext secret }
  /api/v1/me/api-keys/{id}/rotate:
    post:
      summary: Rotate a key with an overlap period
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "201": { description: Replacement key and one-time secret } }
  /api/v1/me/api-keys/{id}/disable:
    post:
      {
        summary: Pause a key,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Disabled } },
      }
  /api/v1/me/api-keys/{id}/scopes:
    put:
      {
        summary: Replace the allowed MCP tool scopes of an existing key,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Scopes updated } },
      }
  /api/v1/me/api-keys/{id}/enable:
    post:
      {
        summary: Reactivate a paused key,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Enabled } },
      }
  /api/v1/me/api-keys/{id}:
    delete:
      {
        summary: Permanently revoke a key,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Revoked } },
      }
  /api/v1/me/usage:
    get:
      {
        summary: Personal MCP usage aggregates,
        responses: { "200": { description: Usage } },
      }
  /api/v1/me/calls:
    get:
      {
        summary: Recent personal MCP calls,
        responses: { "200": { description: Calls } },
      }
  /api/v1/me/notifications:
    get:
      {
        summary: Key expiry and abnormal-usage notifications,
        responses: { "200": { description: Notifications } },
      }
  /api/v1/me/notifications/{id}/read:
    post:
      {
        summary: Mark a notification read,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Read } },
      }
  /api/v1/tools/resolve/test:
    post:
      {
        summary: Test resolve-library-id with current ACL,
        responses: { "200": { description: Candidates } },
      }
  /api/v1/tools/query/test:
    post:
      {
        summary: Test query-docs with current ACL,
        responses: { "200": { description: Text content } },
      }
  /api/v1/tools/search-code/test:
    post:
      {
        summary: Search accessible repositories and remote source APIs without a library ID,
        responses: { "200": { description: Repository and safe source matches } },
      }
  /api/v1/tools/repository-map/test:
    post:
      {
        summary: Read an ACL-filtered repository structure and entry-point map,
        responses: { "200": { description: Repository map } },
      }
  /api/v1/tools/symbols/test:
    post:
      {
        summary: Search indexed code symbols within the current repository ACL,
        responses: { "200": { description: Symbol candidates } },
      }
  /api/v1/tools/symbol-context/test:
    post:
      {
        summary: Read a symbol definition documentation and source context,
        responses: { "200": { description: Symbol context } },
      }
  /api/v1/tools/dependencies/test:
    post:
      {
        summary: Trace ACL-filtered imports calls and data dependencies,
        responses: { "200": { description: Dependency edges } },
      }
  /api/v1/tools/compare-refs/test:
    post:
      {
        summary: Compare indexed symbols between two refs,
        responses: { "200": { description: Added modified and removed symbols } },
      }
  /api/v1/tools/change-impact/test:
    post:
      {
        summary: Analyze ref changes and potentially affected dependents,
        responses: { "200": { description: Change impact analysis } },
      }
  /api/v1/tools/context-pack/test:
    post:
      {
        summary: Search a curated multi-repository Context Pack with per-item ACL checks,
        responses: { "200": { description: Context Pack result } },
      }
  /api/v1/tools/runbooks/test:
    post:
      {
        summary: Search operational runbooks and playbooks,
        responses: { "200": { description: Runbook results } },
      }
  /api/v1/tools/export/test:
    post:
      {
        summary: Export bounded ACL-filtered Markdown context labeled as untrusted data,
        responses: { "200": { description: Safe Markdown context bundle } },
      }
  /api/v1/admin/settings:
    get:
      {
        summary: Configured setting categories,
        responses: { "200": { description: Settings } },
      }
  /api/v1/admin/settings/{category}:
    get:
      {
        summary: Read complete non-secret values with version update metadata and explicit masked-secret field paths,
        parameters: [{ $ref: "#/components/parameters/Category" }],
        responses: { "200": { description: Masked setting } },
      }
    put:
      {
        summary: Validate and atomically version a setting,
        parameters: [{ $ref: "#/components/parameters/Category" }],
        responses: { "200": { description: New version } },
      }
    delete:
      {
        summary: Delete the active setting while retaining audit history,
        parameters: [{ $ref: "#/components/parameters/Category" }],
        responses: { "204": { description: Deleted } },
      }
  /api/v1/admin/settings/{category}/test:
    post:
      {
        summary: Test and validate Keycloak source model OpenSearch telemetry or backup connectivity without saving,
        parameters: [{ $ref: "#/components/parameters/Category" }],
        responses: { "200": { description: Verified } },
      }
  /api/v1/admin/settings/keycloak/status:
    get:
      {
        summary: Verify the currently stored and dynamically applied Keycloak OIDC discovery metadata,
        responses: { "200": { description: Active OIDC version and endpoints }, "503": { description: Stored OIDC setting cannot be applied } },
      }
  /api/v1/admin/notification-deliveries:
    get:
      {
        summary: List external notification delivery status without destination or credential disclosure,
        responses: { "200": { description: Delivery history } },
      }
  /api/v1/admin/notification-deliveries/{id}/retry:
    post:
      {
        summary: Retry a failed or dead external notification delivery,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "202": { description: Retry queued }, "409": { description: Delivery is not retryable } },
      }
  /api/v1/admin/database/status:
    get:
      {
        summary: Metadata database identity pool migration and connectivity diagnostics without DSN disclosure,
        responses: { "200": { description: Database diagnostics }, "503": { description: Database unavailable } },
      }
  /api/v1/admin/database/test:
    post:
      {
        summary: Read-only PostgreSQL DSN connectivity and server identity test,
        responses: { "200": { description: Verified }, "400": { description: Connection failed } },
      }
  /api/v1/admin/database/migrate:
    post:
      {
        summary: Migrate recovery SQLite durable data to PostgreSQL and require restart,
        responses: { "200": { description: Migrated and restart required }, "400": { description: Validation or migration failed } },
      }
  /api/v1/admin/settings/keycloak/test:
    post:
      {
        summary: Test OIDC Discovery and configuration,
        responses: { "200": { description: Connected } },
      }
  /api/v1/admin/settings/keycloak/preview:
    post:
      {
        summary: Verify a short-lived test token and preview claims and role mappings,
        responses: { "200": { description: Mapped identity } },
      }
  /api/v1/admin/settings/bitbucket/test:
    post:
      {
        summary: Test Bitbucket Server connection,
        responses: { "200": { description: Connected } },
      }
  /api/v1/admin/settings/gitlab/test:
    post:
      {
        summary: Test GitLab connection,
        responses: { "200": { description: Connected } },
      }
  /api/v1/admin/sources/{source}/discover:
    post:
      summary: Discover projects or repositories
      parameters:
        - {
            name: source,
            in: path,
            required: true,
            schema: { type: string, enum: [bitbucket, gitlab] },
          }
      responses: { "200": { description: Discovery results } }
  /api/v1/admin/repositories:
    get:
      {
        summary: Registered repositories,
        responses: { "200": { description: Repositories } },
      }
    post:
      {
        summary: Register and enqueue initial index,
        responses: { "201": { description: Registered } },
      }
  /api/v1/admin/repositories/{id}/index:
    post:
      {
        summary: Enqueue a ref index,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "202": { description: Queued } },
      }
  /api/v1/admin/repositories/{id}/refs:
    get:
      {
        summary: List available branches and tags from the source,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "200": { description: References } },
      }
  /api/v1/admin/repositories/{id}/policy:
    get:
      {
        summary: Read the repository index policy,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "200": { description: Index policy } },
      }
    put:
      {
        summary: Replace the repository index policy,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "200": { description: Updated policy } },
      }
  /api/v1/admin/index-jobs:
    get:
      {
        summary: Recent index jobs,
        responses: { "200": { description: Jobs } },
      }
  /api/v1/admin/index-jobs/{id}/retry:
    post:
      {
        summary: Retry a failed job,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "202": { description: Queued } },
      }
  /api/v1/admin/api-keys:
    get:
      {
        summary: List all key metadata,
        responses: { "200": { description: Keys } },
      }
  /api/v1/admin/users:
    get:
      {
        summary: List users and assignable platform roles,
        responses: { "200": { description: User and role list } },
      }
    post:
      {
        summary: Pre-provision a Keycloak user by subject,
        responses: { "201": { description: User created }, "409": { description: Duplicate subject } },
      }
  /api/v1/admin/context-packs:
    get:
      {
        summary: List Context Packs and repository members,
        responses: { "200": { description: Context Packs } },
      }
    post:
      {
        summary: Create a Context Pack,
        responses: { "201": { description: Context Pack created } },
      }
  /api/v1/admin/context-packs/{id}:
    put:
      {
        summary: Replace a Context Pack and its ordered members,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Context Pack updated } },
      }
    delete:
      {
        summary: Delete a Context Pack,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Context Pack deleted } },
      }
  /api/v1/admin/users/{id}:
    put:
      {
        summary: Update user profile status and platform roles,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: User updated }, "409": { description: Self lockout prevented } },
      }
    delete:
      {
        summary: Soft-delete a user and revoke sessions and API keys,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: User deleted } },
      }
  /api/v1/admin/api-keys/{id}/revoke:
    post:
      {
        summary: Security administrator key revocation,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Revoked } },
      }
  /api/v1/admin/api-keys/{id}/scopes:
    put:
      {
        summary: Replace an existing MCP key's tool scopes,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Scopes updated and audited } },
      }
  /api/v1/admin/secrets:
    get:
      {
        summary: List managed secret metadata without plaintext values,
        responses: { "200": { description: Secret metadata } },
      }
    post:
      {
        summary: Create or rotate an encrypted database or Vault KV v2 secret,
        responses: { "201": { description: Secret metadata } },
      }
  /api/v1/admin/secrets/{name}/rotate:
    post:
      {
        summary: Rotate a managed secret while retaining encrypted version history,
        parameters: [{ name: name, in: path, required: true, schema: { type: string } }],
        responses: { "201": { description: Rotated secret metadata } },
      }
  /api/v1/admin/secrets/{name}/disable:
    post:
      {
        summary: Disable a managed secret and fail closed for future references,
        parameters: [{ name: name, in: path, required: true, schema: { type: string } }],
        responses: { "204": { description: Disabled } },
      }
  /api/v1/admin/audit-logs:
    get:
      {
        summary: Immutable audit records,
        responses: { "200": { description: Audit records } },
      }
  /api/v1/admin/security-events:
    get:
      {
        summary: Index-time secret detections and actions,
        responses: { "200": { description: Security events } },
      }
  /api/v1/admin/health:
    get:
      {
        summary: Administrative service status,
        responses: { "200": { description: Health } },
      }
  /api/v1/admin/backups:
    get:
      {
        summary: List encrypted database backups,
        responses: { "200": { description: Backup records } },
      }
    post:
      {
        summary: Create an encrypted database backup,
        responses: { "201": { description: Completed backup record } },
      }
  /api/v1/admin/backups/{id}/download:
    get:
      summary: Download a verified encrypted backup archive
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Authenticated encrypted gzip archive } }
  /api/v1/admin/backups/{id}/restore:
    post:
      summary: Transactionally restore a compatible backup and invalidate web sessions
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - {
            name: X-Restore-Confirmation,
            in: header,
            required: true,
            schema: { type: string },
            description: "RESTORE followed by a space and the backup id",
          }
      responses: { "204": { description: Restored } }
  /api/v1/admin/quality/cases:
    get:
      {
        summary: List ACL-aware search quality cases,
        responses: { "200": { description: Cases } },
      }
    post:
      {
        summary: Create a quality case with expected source paths,
        responses: { "201": { description: Created } },
      }
  /api/v1/admin/quality/cases/{id}:
    delete:
      {
        summary: Delete an unused quality case,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "204": { description: Deleted } },
      }
  /api/v1/admin/quality/runs:
    get:
      {
        summary: List Recall@K MRR and nDCG@K benchmark runs,
        responses: { "200": { description: Runs } },
      }
    post:
      {
        summary: Execute the current production search configuration against enabled cases,
        responses: { "201": { description: Completed run } },
      }
  /api/v1/admin/quality/runs/{id}/results:
    get:
      {
        summary: List per-case ranked sources and metrics,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "200": { description: Results } },
      }
  /api/v1/admin/mcp/tools:
    get:
      {
        summary: MCP tool schemas and runtime policies,
        responses: { "200": { description: Tool catalog } },
      }
  /api/v1/admin/mcp/tools/{id}:
    put:
      {
        summary: Change tool enabled state timeout and cache,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses: { "200": { description: Updated policy } },
      }
components:
  securitySchemes:
    keycloakBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    context7Key: { type: apiKey, in: header, name: CONTEXT7_API_KEY }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Category:
      { name: category, in: path, required: true, schema: { type: string } }
  schemas:
    CreateAPIKey:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        scopes:
          {
            type: array,
            items:
              type: string
              enum:
                - resolve-library-id
                - query-docs
                - search-repositories
                - search-source
                - get-repository-map
                - find-symbol
                - get-symbol-context
                - trace-dependencies
                - compare-refs
                - get-change-impact
                - get-context-pack
                - find-runbook
                - export-context
                - explain-search-result
                - get-platform-status
                - list-index-jobs
                - reindex-repository
          }
        expiresAt: { type: [string, "null"], format: date-time }
        restrictions:
          type: object
          properties:
            allowedCidrs: { type: array, items: { type: string } }
            allowedRepositories:
              {
                type: array,
                items: { type: string, pattern: "^/[^/]+/[^/]+$" },
              }
            ratePerMinute: { type: integer, minimum: 0 }
            ratePerHour: { type: integer, minimum: 0 }
            ratePerDay: { type: integer, minimum: 0 }
