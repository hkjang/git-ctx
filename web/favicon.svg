<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Git Coral Gradient -->
    <linearGradient id="git-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F05032"/>
    </linearGradient>

    <!-- Context Cyan Gradient -->
    <linearGradient id="ctx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Hexagonal Tech Frame -->
  <path d="M 256 64 L 416 160 L 416 352 L 256 448 L 96 352 L 96 160 Z"
        fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Git Branching Node Paths -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Commit Trunk -->
    <path d="M 176 140 L 176 372" stroke="url(#git-grad)" stroke-width="28" filter="url(#glow)"/>

    <!-- Branch Arc to Context Core -->
    <path d="M 176 256 C 220 256 240 180 320 180" stroke="url(#git-grad)" stroke-width="24" fill="none"/>
    <path d="M 176 310 C 230 310 260 370 336 330" stroke="url(#ctx-grad)" stroke-width="24" fill="none"/>

    <!-- Context Loop Ring / 'C' Structure -->
    <path d="M 360 210 A 90 90 0 1 1 360 302" stroke="url(#ctx-grad)" stroke-width="28" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Node Dots -->
  <!-- Git Main Nodes -->
  <circle cx="176" cy="140" r="24" fill="#FFF" stroke="url(#git-grad)" stroke-width="10"/>
  <circle cx="176" cy="256" r="20" fill="url(#git-grad)"/>
  <circle cx="176" cy="372" r="24" fill="#FFF" stroke="url(#git-grad)" stroke-width="10"/>

  <!-- Branch / Context Nodes -->
  <circle cx="320" cy="180" r="20" fill="url(#git-grad)"/>
  <circle cx="336" cy="330" r="20" fill="url(#ctx-grad)"/>
  <circle cx="270" cy="256" r="14" fill="#38BDF8" filter="url(#glow)"/>
</svg>
