<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Git Coral Gradient -->
    <linearGradient id="logo-git-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F05032"/>
    </linearGradient>

    <!-- Context Cyan Gradient -->
    <linearGradient id="logo-ctx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(20, 20)">
    <!-- Squircle Container -->
    <rect width="160" height="160" rx="36" fill="#0F172A" stroke="#1E293B" stroke-width="4"/>

    <!-- Hex Outline -->
    <path d="M 80 20 L 132 50 L 132 110 L 80 140 L 28 110 L 28 50 Z"
          fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Git Trunk & Branch -->
    <path d="M 55 45 L 55 115" stroke="url(#logo-git-grad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 55 80 C 70 80 75 55 105 55" stroke="url(#logo-git-grad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 55 95 C 75 95 85 115 110 102" stroke="url(#logo-ctx-grad)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Context Loop Arc 'C' -->
    <path d="M 115 65 A 30 30 0 1 1 115 95" stroke="url(#logo-ctx-grad)" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#logo-glow)"/>

    <!-- Node Circles -->
    <circle cx="55" cy="45" r="8" fill="#FFFFFF" stroke="url(#logo-git-grad)" stroke-width="4"/>
    <circle cx="55" cy="80" r="6" fill="url(#logo-git-grad)"/>
    <circle cx="55" cy="115" r="8" fill="#FFFFFF" stroke="url(#logo-git-grad)" stroke-width="4"/>
    <circle cx="105" cy="55" r="6" fill="url(#logo-git-grad)"/>
    <circle cx="110" cy="102" r="6" fill="url(#logo-ctx-grad)"/>
    <circle cx="85" cy="80" r="4.5" fill="#38BDF8" filter="url(#logo-glow)"/>
  </g>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800">
    <!-- 'git' in coral/orange -->
    <text x="210" y="118" font-size="76" fill="url(#logo-git-grad)" letter-spacing="-2">git</text>

    <!-- Hyphen divider -->
    <text x="312" y="118" font-size="76" fill="#475569" letter-spacing="-2">-</text>

    <!-- 'ctx' in cyan/indigo -->
    <text x="348" y="118" font-size="76" fill="url(#logo-ctx-grad)" letter-spacing="-2">ctx</text>

    <!-- Tagline / Subtitle -->
    <text x="214" y="152" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="3">DEV KNOWLEDGE CONTEXT ENGINE</text>
  </g>
</svg>
